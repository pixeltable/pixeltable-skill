name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Validate plugin layout
        run: python3 scripts/validate_plugin.py

      - name: Hook unit tests
        run: python3 tests/test_hooks.py

      - name: Integration structure tests
        run: python3 tests/test_integrations.py

      - name: Standalone Codex skill install
        run: |
          bash -n install.sh
          HOME="$RUNNER_TEMP/pixeltable-home" ./install.sh --platform codex-skill
          test -f "$RUNNER_TEMP/pixeltable-home/.agents/skills/pixeltable/SKILL.md"
          test -f "$RUNNER_TEMP/pixeltable-home/.agents/skills/pixeltable/agents/openai.yaml"
          for skill in agent-memory audio-transcription-search dataset-versioning image-similarity-search incremental-ml-pipeline multimodal-rag vector-database-alternative video-search; do
            test -f "$RUNNER_TEMP/pixeltable-home/.agents/skills/$skill/SKILL.md"
            test -f "$RUNNER_TEMP/pixeltable-home/.agents/skills/$skill/agents/openai.yaml"
            grep -qF '../pixeltable/SKILL.md' "$RUNNER_TEMP/pixeltable-home/.agents/skills/$skill/SKILL.md"
          done

      - name: Lint hooks and scripts (ruff)
        run: |
          pip install 'ruff==0.16.8'
          ruff check hooks/ scripts/ tests/ integrations/

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Plugin discovery (npx plugins)
        run: npx -y plugins discover .

      - name: Skill discovery (npx skills)
        run: npx -y skills add . --list -y || npx -y skills add . --list
